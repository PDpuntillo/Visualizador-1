<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GGAL — Opciones AB</title>
  <style>
    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding-bottom: 44px;
    }

    /* ── Header + Tabs ──────────────────────────────────── */
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 0 24px;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
      height: 48px;
    }
    .tabs-bar { display: flex; align-items: stretch; }
    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #8b949e;
      padding: 0 20px;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
      font-family: inherit;
    }
    .tab:hover { color: #e6edf3; }
    .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }

    .refresh-btn {
      background: none;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      padding: 5px 14px;
      font-size: .78rem;
      cursor: pointer;
      transition: all .15s;
      margin: auto 0;
      font-family: inherit;
    }
    .refresh-btn:hover { background: #21262d; color: #e6edf3; }
    .refresh-btn:disabled { opacity: .4; cursor: default; }

    /* ── Price cards ─────────────────────────────────────── */
    .cards { display: flex; flex-wrap: wrap; gap: 14px; padding: 16px 24px 10px; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px 22px;
      min-width: 170px;
    }
    .card .label { font-size: .68rem; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .card .price { font-size: 1.7rem; font-weight: 700; font-family: monospace; }
    .card .change { font-size: .82rem; margin-top: 4px; font-family: monospace; }
    .card .bid-ask { font-size: .72rem; color: #8b949e; margin-top: 6px; font-family: monospace; }
    .card .bid-ask span.b { color: #3fb950; }
    .card .bid-ask span.a { color: #f85149; }

    /* ── Colors ─────────────────────────────────────────── */
    .up   { color: #3fb950; }
    .down { color: #f85149; }
    .flat { color: #8b949e; }

    /* ── Chain layout ────────────────────────────────────── */
    .chain-meta { padding: 10px 24px 6px; font-size: .72rem; color: #8b949e; }
    .chain-layout {
      display: flex;
      gap: 10px;
      padding: 0 24px;
      align-items: flex-start;
    }
    /* Cada panel es su propio contenedor de scroll (x e y)
       para que position:sticky en th funcione correctamente */
    .chain-panel {
      flex: 1;
      min-width: 0;
      overflow: auto;
      max-height: calc(100vh - 285px); /* viewport - header - cards - meta - statusbar */
    }
    /* Scrollbars personalizados — color del header de columnas */
    .chain-panel::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .chain-panel::-webkit-scrollbar-track {
      background: #0d1117; /* fondo de la app */
    }
    .chain-panel::-webkit-scrollbar-thumb {
      background: #30363d; /* borde del header */
      border-radius: 4px;
      border: 2px solid #0d1117;
    }
    .chain-panel::-webkit-scrollbar-thumb:hover {
      background: #484f58;
    }
    .chain-panel::-webkit-scrollbar-corner {
      background: #0d1117;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .panel-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 4px;
      display: inline-block;
    }
    .panel-label.calls { background: rgba(63,185,80,.15);  color: #3fb950; }
    .panel-label.puts  { background: rgba(248,81,73,.12);  color: #f85149; }

    .filter-btn {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      padding: 3px 8px;
      font-size: .82rem;
      line-height: 1;
      letter-spacing: 1px;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .filter-btn:hover { background: #21262d; color: #e6edf3; }
    .filter-btn.open  { color: #58a6ff; border-color: #58a6ff; background: #0d1f3c; }

    .filter-panel {
      position: fixed;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px 16px;
      min-width: 210px;
      max-height: 62vh;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,.55);
    }
    .filter-panel.open { display: block; }

    /* ── Table ───────────────────────────────────────────── */
    table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: .81rem; }
    thead tr {
      background: #161b22;
      border-bottom: 2px solid #30363d;
    }
    th {
      padding: 8px 10px;
      text-align: right;
      color: #8b949e;
      font-weight: 600;
      font-size: .66rem;
      text-transform: uppercase;
      letter-spacing: .4px;
      white-space: nowrap;
      position: sticky;
      top: 0; /* relativo al chain-panel que es el scroll container */
      z-index: 6;
      background: #161b22;
      cursor: help;
      user-select: none;
      box-shadow: 0 2px 0 #30363d;
    }
    th.left { text-align: left; }

    /* Tooltip con posición dinámica vía CSS custom properties */
    th[data-tip]::after {
      content: attr(data-tip);
      position: fixed;
      top: var(--tip-y, 80px);
      left: var(--tip-x, 0px);
      transform: translateX(-50%);
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: .73rem;
      font-weight: 400;
      white-space: nowrap;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      text-transform: none;
      letter-spacing: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,.5);
    }
    th[data-tip]:hover::after { opacity: 1; }

    tbody tr { border-bottom: 1px solid #21262d; transition: background .1s; }
    tbody tr:hover { background: #1c2128; }
    tbody tr.itm   { background: rgba(63,185,80,.04); }
    tbody tr.itm:hover { background: rgba(63,185,80,.09); }

    td { padding: 7px 10px; text-align: right; font-family: monospace; white-space: nowrap; }
    td.left  { text-align: left; }
    td.sym   { font-weight: 600; color: #58a6ff; font-family: 'Segoe UI', sans-serif; }
    td.strike{ font-weight: 700; color: #e6edf3; }
    td.bid-c { color: #3fb950; }
    td.ask-c { color: #f85149; }
    td.vi    { color: #d2a8ff; }
    td.ve    { color: #ffa657; }
    td.muted { color: #8b949e; font-size: .76rem; }

    .chip { display: inline-block; background: #21262d; border-radius: 4px; padding: 1px 6px; font-size: .7rem; color: #8b949e; }
    .badge { display: inline-block; font-size: .58rem; font-weight: 700; letter-spacing: .4px; border-radius: 3px; padding: 1px 4px; margin-left: 4px; font-family: sans-serif; vertical-align: middle; }
    .badge.itm { background: rgba(63,185,80,.2);    color: #3fb950; }
    .badge.otm { background: rgba(248,81,73,.15);   color: #f85149; }
    .badge.atm { background: rgba(210,168,255,.15); color: #d2a8ff; }

    /* ── Gear ────────────────────────────────────────────── */
    .gear-wrapper { flex-shrink: 0; position: relative; padding-top: 30px; }
    .gear-btn {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #8b949e;
      width: 36px;
      height: 36px;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      position: sticky;
      top: 58px;
    }
    .gear-btn:hover { background: #21262d; color: #e6edf3; }
    .gear-btn.open  { color: #58a6ff; border-color: #58a6ff; background: #0d1f3c; }

    .gear-panel {
      position: fixed;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px 16px;
      min-width: 230px;
      max-height: 72vh;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,.55);
    }
    .gear-panel.open { display: block; }
    /* Scrollbars para gear-panel y filter-panel */
    .gear-panel::-webkit-scrollbar,
    .filter-panel::-webkit-scrollbar { width: 8px; height: 8px; }
    .gear-panel::-webkit-scrollbar-track,
    .filter-panel::-webkit-scrollbar-track { background: #0d1117; }
    .gear-panel::-webkit-scrollbar-thumb,
    .filter-panel::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; border: 2px solid #0d1117; }
    .gear-panel::-webkit-scrollbar-thumb:hover,
    .filter-panel::-webkit-scrollbar-thumb:hover { background: #484f58; }
    .gear-title { font-size: .67rem; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #30363d; }
    .gear-all { display: flex; gap: 6px; margin-bottom: 10px; }
    .gear-all button {
      flex: 1;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 5px;
      color: #8b949e;
      font-size: .72rem;
      padding: 4px 0;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .gear-all button:hover { background: #30363d; color: #e6edf3; }
    .gear-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 0;
      font-size: .82rem;
      cursor: pointer;
      color: #c9d1d9;
      border-bottom: 1px solid #21262d;
      line-height: 1.3;
    }
    .gear-item:last-child { border-bottom: none; }
    .gear-item:hover { color: #e6edf3; }
    .gear-item input[type=checkbox] { accent-color: #58a6ff; cursor: pointer; margin-top: 2px; flex-shrink: 0; }
    .gear-col-name { font-weight: 600; }
    .gear-col-tip  { font-size: .68rem; color: #6e7681; display: block; margin-top: 1px; }

    /* ── Status bar ──────────────────────────────────────── */
    .status-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 6px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .71rem;
      color: #8b949e;
      z-index: 20;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 7px; background: #8b949e; }
    .dot.ok      { background: #3fb950; animation: pulse 2s infinite; }
    .dot.loading { background: #d29922; }
    .dot.error   { background: #f85149; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .placeholder { text-align: center; padding: 50px 24px; color: #8b949e; font-size: .88rem; }
    .error-box { margin: 16px 0; padding: 16px; background: #2d1117; border: 1px solid #f85149; border-radius: 8px; color: #f85149; font-size: .85rem; line-height: 1.6; }
    .countdown { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

<!-- ══ HEADER + TABS ════════════════════════════════════ -->
<header>
  <div class="tabs-bar">
    <button class="tab active" data-tab="ggal-ab">📈 GGAL AB</button>
    <!-- futuras tabs aquí -->
  </div>
  <button class="refresh-btn" id="refresh-btn" onclick="fetchData()">↻ Actualizar</button>
</header>

<!-- ══ PRICE CARDS ════════════════════════════════════════ -->
<div class="cards">
  <div class="card">
    <div class="label">GGAL 48hs</div>
    <div class="price flat" id="ggal-price">—</div>
    <div class="change flat" id="ggal-chg">—</div>
    <div class="bid-ask" id="ggal-ba">—</div>
  </div>
  <div class="card">
    <div class="label">GGAL CI</div>
    <div class="price flat" id="ggalci-price">—</div>
    <div class="change flat" id="ggalci-chg">—</div>
    <div class="bid-ask" id="ggalci-ba">—</div>
  </div>
</div>

<!-- ══ CADENA DE OPCIONES ════════════════════════════════ -->
<div class="chain-meta"><span id="last-update"></span></div>

<div class="chain-layout">

  <!-- CALLS -->
  <div class="chain-panel">
    <div class="panel-header">
      <span class="panel-label calls">● Calls</span>
      <button class="filter-btn" id="filter-btn-calls" onclick="toggleFilter('calls')" title="Filtrar strikes">···</button>
    </div>
    <div id="calls-container"><div class="placeholder">⏳ Cargando…</div></div>
  </div>

  <!-- PUTS -->
  <div class="chain-panel">
    <div class="panel-header">
      <span class="panel-label puts">● Puts</span>
      <button class="filter-btn" id="filter-btn-puts" onclick="toggleFilter('puts')" title="Filtrar strikes">···</button>
    </div>
    <div id="puts-container"><div class="placeholder">⏳ Cargando…</div></div>
  </div>

  <!-- Paneles de filtro (position:fixed, posicionados por JS) -->
  <div class="filter-panel" id="filter-panel-calls"></div>
  <div class="filter-panel" id="filter-panel-puts"></div>

  <!-- ⚙ GEAR -->
  <div class="gear-wrapper">
    <button class="gear-btn" id="gear-btn" onclick="toggleGear()" title="Configurar columnas">⚙</button>
    <div class="gear-panel" id="gear-panel"></div>
  </div>

</div>

<!-- ══ STATUS BAR ════════════════════════════════════════ -->
<div class="status-bar">
  <div>
    <span class="dot" id="dot"></span>
    <span id="status-msg">Conectando…</span>
  </div>
  <div>
    Próxima actualización: <span class="countdown" id="countdown">60</span>s &nbsp;|&nbsp;
    Fuente: EPGB · Google Sheets
  </div>
</div>

<!-- ══ SCRIPT ════════════════════════════════════════════ -->
<script>
  /* ── Config ────────────────────────────────────────── */
  const SHEET_ID  = '12wVjK5f4jqbjzZIo4DQQ7PNd2_4_NgxNVZ_fUZoDqBg';
  const GID_AB    = '863748030';
  const REFRESH_S = 60;

  /* ── Índices de columna fijos ──────────────────────── */
  const C = {
    symbol:  0, bidsize: 1, bid: 2, bidVI: 3, askVI: 4,
    ask: 5, asksize: 6, last: 7, chg: 8, strike: 9,
    lastVI: 10, lastVE: 11, open: 12, high: 13,
  };

  /* ── Definición de columnas ────────────────────────── */
  const COL_DEFS = [
    { key: 'strike', label: 'Strike',  tip: 'Precio de ejercicio de la opción',                 on: true  },
    { key: 'bid',    label: 'Bid',     tip: 'Mejor precio comprador en el mercado',              on: true  },
    { key: 'bidVI',  label: 'Bid VI',  tip: 'Volatilidad implícita calculada sobre el bid',      on: true  },
    { key: 'ask',    label: 'Ask',     tip: 'Mejor precio vendedor en el mercado',               on: true  },
    { key: 'askVI',  label: 'Ask VI',  tip: 'Volatilidad implícita calculada sobre el ask',      on: true  },
    { key: 'bdsz',   label: 'BdSz',   tip: 'Contratos ofrecidos al bid (tamaño)',               on: true  },
    { key: 'aksz',   label: 'AkSz',   tip: 'Contratos ofrecidos al ask (tamaño)',               on: true  },
    { key: 'last',   label: 'Último',  tip: 'Precio del último negocio cerrado',                 on: true  },
    { key: 'chg',    label: 'Var %',   tip: 'Variación porcentual respecto al cierre anterior',  on: true  },
    { key: 'lastVI', label: 'Last VI', tip: 'Volatilidad implícita del último precio negociado', on: true  },
    { key: 've',     label: 'VE',      tip: 'Valor extrínseco (tiempo) de la opción',            on: true  },
    { key: 'open',   label: 'Open',    tip: 'Precio de apertura del día',                        on: false },
    { key: 'high',   label: 'High',    tip: 'Precio máximo alcanzado en el día',                 on: false },
  ];

  const colVisible = {};
  COL_DEFS.forEach(d => colVisible[d.key] = d.on);

  let cdVal = REFRESH_S, cdTimer;
  let ggalLast = null, storedData = [];
  const hiddenStrikes = { calls: new Set(), puts: new Set() };

  /* ── Helpers ───────────────────────────────────────── */
  const clean    = raw => String(raw ?? '').replace(/"/g, '').trim();
  const parseNum = raw => parseFloat(clean(raw).replace(/\./g,'').replace(',','.').replace('%',''));
  const fmt      = (raw, dec=2) => { const n=parseNum(raw); return isNaN(n)?'—':n.toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); };
  const fmtPct   = raw => { const n=parseNum(raw); return isNaN(n)?'—':(n>=0?'+':'')+n.toFixed(2)+'%'; };
  const cc       = raw => { const n=parseNum(raw); return isNaN(n)||n===0?'flat':n>0?'up':'down'; };
  const gc       = (row,idx) => clean(row[idx]??'');
  const setStatus = (type,msg) => {
    document.getElementById('dot').className = `dot ${type}`;
    document.getElementById('status-msg').textContent = msg;
  };

  /* ── CSV parser ────────────────────────────────────── */
  function parseCSV(text) {
    return text.split('\n').filter(l=>l.trim()).map(line => {
      const cols=[]; let cur='', inQ=false;
      for(const ch of line){
        if(ch==='"'){inQ=!inQ;}
        else if(ch===','&&!inQ){cols.push(cur);cur='';}
        else cur+=ch;
      }
      cols.push(cur); return cols;
    });
  }

  /* ── Valor y clase de cada celda ───────────────────── */
  function cellVal(key, row) {
    const v = { strike:fmt(gc(row,C.strike),2), bid:fmt(gc(row,C.bid),0), bidVI:gc(row,C.bidVI)||'—',
      ask:fmt(gc(row,C.ask),0), askVI:gc(row,C.askVI)||'—',
      bdsz:`<span class="chip">${gc(row,C.bidsize)||'—'}</span>`,
      aksz:`<span class="chip">${gc(row,C.asksize)||'—'}</span>`,
      last:fmt(gc(row,C.last),0), chg:fmtPct(gc(row,C.chg)),
      lastVI:gc(row,C.lastVI)||'—', ve:gc(row,C.lastVE)||'—',
      open:fmt(gc(row,C.open),0), high:fmt(gc(row,C.high),0) };
    return v[key]??'—';
  }
  function cellCls(key, colorCls) {
    const m={strike:'strike',bid:'bid-c',bidVI:'vi',ask:'ask-c',askVI:'vi',
      bdsz:'muted',aksz:'muted',last:colorCls,chg:colorCls,lastVI:'vi',ve:'ve',open:'muted',high:'muted'};
    return m[key]||'';
  }

  /* ── Construye tabla ───────────────────────────────── */
  function buildTable(rows, type) {
    const vis = COL_DEFS.filter(d => colVisible[d.key]);
    let html = `<table><thead><tr>
      <th class="left" data-tip="Símbolo del contrato de opción">Símbolo</th>`;
    vis.forEach(col => { html += `<th data-tip="${col.tip}">${col.label}</th>`; });
    html += '</tr></thead><tbody>';

    if (!rows.length) {
      html += `<tr><td colspan="${vis.length+1}" class="muted" style="text-align:center;padding:40px">Sin datos disponibles</td></tr>`;
    } else {
      for (const r of rows) {
        const sym = gc(r,C.symbol);
        const k   = parseNum(gc(r,C.strike));
        const chg = gc(r,C.chg);
        const c   = cc(chg);
        const itm = ggalLast && !isNaN(k) && (type==='call' ? k<ggalLast : k>ggalLast);

        let badge = '';
        if (ggalLast && !isNaN(k)) {
          const d = Math.abs(ggalLast-k)/ggalLast;
          const i = type==='call' ? k<ggalLast : k>ggalLast;
          badge = d<0.015 ? '<span class="badge atm">ATM</span>'
                : i       ? '<span class="badge itm">ITM</span>'
                :            '<span class="badge otm">OTM</span>';
        }

        html += `<tr class="${itm?'itm':''}"><td class="sym left">${sym}${badge}</td>`;
        vis.forEach(col => { html += `<td class="${cellCls(col.key,c)}">${cellVal(col.key,r)}</td>`; });
        html += '</tr>';
      }
    }
    return html + '</tbody></table>';
  }

  /* ── Renderiza las dos tablas ──────────────────────── */
  function renderTables(dataRows) {
    const srt = arr => [...arr].sort((a,b)=>parseNum(gc(a,C.strike))-parseNum(gc(b,C.strike)));
    const callRows = srt(dataRows.filter(r=>gc(r,C.symbol).startsWith('GFGC')))
                      .filter(r=>!hiddenStrikes.calls.has(gc(r,C.symbol)));
    const putRows  = srt(dataRows.filter(r=>gc(r,C.symbol).startsWith('GFGV')))
                      .filter(r=>!hiddenStrikes.puts.has(gc(r,C.symbol)));
    document.getElementById('calls-container').innerHTML = buildTable(callRows, 'call');
    document.getElementById('puts-container').innerHTML  = buildTable(putRows,  'put');
  }

  /* ── Render completo ───────────────────────────────── */
  function renderAll(rows) {
    storedData = rows;
    let lastUpdate = '';
    const dataRows = [];

    for (const r of rows) {
      const sym = clean(r[C.symbol]);
      if (/ltima/i.test(sym)) {
        for (let j=1;j<r.length;j++) { if(clean(r[j])){ lastUpdate=clean(r[j]); break; } }
        continue;
      }
      if (!sym || sym==='symbol') continue;
      dataRows.push(r);
    }

    document.getElementById('last-update').textContent = lastUpdate ? `Última actualización: ${lastUpdate}` : '';

    const ggal   = dataRows.find(r => gc(r,C.symbol)==='GGAL');
    const ggalCI = dataRows.find(r => gc(r,C.symbol)==='GGAL - CI');

    const updateCard = (prefix, row) => {
      if (!row) return;
      const last = gc(row,C.last), chg = gc(row,C.chg), c = cc(chg);
      document.getElementById(`${prefix}-price`).textContent = fmt(last,0);
      document.getElementById(`${prefix}-price`).className   = `price ${c}`;
      document.getElementById(`${prefix}-chg`).textContent   = fmtPct(chg);
      document.getElementById(`${prefix}-chg`).className     = `change ${c}`;
      document.getElementById(`${prefix}-ba`).innerHTML      =
        `<span class="b">B ${fmt(gc(row,C.bid),0)}</span>&nbsp;/&nbsp;<span class="a">A ${fmt(gc(row,C.ask),0)}</span>`;
    };
    ggalLast = ggal ? parseNum(gc(ggal,C.last)) : ggalLast;
    updateCard('ggal',   ggal);
    updateCard('ggalci', ggalCI);
    renderTables(dataRows);
  }

  /* ── Filter panel (por strikes) ────────────────────── */
  function buildFilterPanel(side) {
    const prefix = side === 'calls' ? 'GFGC' : 'GFGV';
    const dataRows = storedData.filter(r => { const s=clean(r[C.symbol]); return s&&s!=='symbol'&&!/ltima/i.test(s); });
    const rows = [...dataRows.filter(r=>gc(r,C.symbol).startsWith(prefix))]
                  .sort((a,b)=>parseNum(gc(a,C.strike))-parseNum(gc(b,C.strike)));
    const hidden = hiddenStrikes[side];
    let html = `<div class="gear-title">Strikes visibles</div>
      <div class="gear-all">
        <button onclick="setAllStrikes('${side}',true)">Mostrar todo</button>
        <button onclick="setAllStrikes('${side}',false)">Ocultar todo</button>
      </div>`;
    rows.forEach(row => {
      const sym = gc(row,C.symbol);
      const strike = fmt(gc(row,C.strike),2);
      html += `<label class="gear-item">
        <input type="checkbox" ${hidden.has(sym)?'':'checked'} onchange="toggleStrike('${side}','${sym}',this.checked)">
        <span><span class="gear-col-name">${strike}</span>
              <span class="gear-col-tip">${sym}</span></span>
      </label>`;
    });
    document.getElementById(`filter-panel-${side}`).innerHTML = html;
  }

  function toggleFilter(side) {
    const btn   = document.getElementById(`filter-btn-${side}`);
    const panel = document.getElementById(`filter-panel-${side}`);
    const open  = !panel.classList.contains('open');
    // Cerrar el otro lado si está abierto
    const other = side === 'calls' ? 'puts' : 'calls';
    document.getElementById(`filter-panel-${other}`).classList.remove('open');
    document.getElementById(`filter-btn-${other}`).classList.remove('open');
    if (open) {
      const r = btn.getBoundingClientRect();
      panel.style.top       = (r.bottom + 6) + 'px';
      panel.style.left      = r.left + 'px';
      panel.style.maxHeight = (window.innerHeight - r.bottom - 16) + 'px';
      buildFilterPanel(side);
    }
    panel.classList.toggle('open', open);
    btn.classList.toggle('open', open);
  }

  function toggleStrike(side, sym, visible) {
    if (visible) hiddenStrikes[side].delete(sym);
    else         hiddenStrikes[side].add(sym);
    refreshTables();
  }

  function setAllStrikes(side, visible) {
    hiddenStrikes[side].clear();
    if (!visible) {
      const prefix = side === 'calls' ? 'GFGC' : 'GFGV';
      storedData.filter(r=>{ const s=clean(r[C.symbol]); return s&&s!=='symbol'&&!/ltima/i.test(s); })
                .filter(r=>gc(r,C.symbol).startsWith(prefix))
                .forEach(r=>hiddenStrikes[side].add(gc(r,C.symbol)));
    }
    buildFilterPanel(side);
    refreshTables();
  }

  /* ── Gear panel ────────────────────────────────────── */
  function buildGearPanel() {
    let html = `<div class="gear-title">Columnas visibles</div>
      <div class="gear-all">
        <button onclick="setAllCols(true)">Activar todo</button>
        <button onclick="setAllCols(false)">Desactivar todo</button>
      </div>`;
    COL_DEFS.forEach(col => {
      html += `<label class="gear-item">
        <input type="checkbox" ${colVisible[col.key]?'checked':''} onchange="toggleCol('${col.key}',this.checked)">
        <span><span class="gear-col-name">${col.label}</span>
              <span class="gear-col-tip">${col.tip}</span></span>
      </label>`;
    });
    document.getElementById('gear-panel').innerHTML = html;
  }

  function toggleGear() {
    const btn = document.getElementById('gear-btn');
    const panel = document.getElementById('gear-panel');
    const open = !panel.classList.contains('open');
    if (open) {
      const r = btn.getBoundingClientRect();
      panel.style.top       = (r.bottom + 6) + 'px';
      panel.style.right     = (window.innerWidth - r.right) + 'px';
      panel.style.maxHeight = (window.innerHeight - r.bottom - 16) + 'px';
      buildGearPanel();
    }
    panel.classList.toggle('open', open);
    btn.classList.toggle('open', open);
  }

  function toggleCol(key, visible) { colVisible[key]=visible; refreshTables(); }
  function setAllCols(v) { COL_DEFS.forEach(d=>colVisible[d.key]=v); buildGearPanel(); refreshTables(); }
  function refreshTables() {
    if (!storedData.length) return;
    renderTables(storedData.filter(r=>{ const s=clean(r[C.symbol]); return s&&s!=='symbol'&&!/ltima/i.test(s); }));
  }

  // Cerrar paneles al click afuera
  document.addEventListener('click', e => {
    // Gear
    if (!document.querySelector('.gear-wrapper').contains(e.target)) {
      document.getElementById('gear-panel').classList.remove('open');
      document.getElementById('gear-btn').classList.remove('open');
    }
    // Filtros de strikes
    ['calls','puts'].forEach(side => {
      const btn   = document.getElementById(`filter-btn-${side}`);
      const panel = document.getElementById(`filter-panel-${side}`);
      if (!btn.contains(e.target) && !panel.contains(e.target)) {
        panel.classList.remove('open');
        btn.classList.remove('open');
      }
    });
  });

  // Posición dinámica del tooltip
  document.addEventListener('mousemove', e => {
    if (e.target.matches('th[data-tip]')) {
      e.target.style.setProperty('--tip-x', e.clientX + 'px');
      e.target.style.setProperty('--tip-y', (e.clientY - 40) + 'px');
    }
  });

  /* ── Fetch ─────────────────────────────────────────── */
  async function fetchData() {
    document.getElementById('refresh-btn').disabled = true;
    setStatus('loading', 'Actualizando…');
    try {
      const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID_AB}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      renderAll(parseCSV(await res.text()));
      resetCountdown();
      setStatus('ok', 'Datos actualizados correctamente');
    } catch(e) {
      setStatus('error', 'Error al cargar datos');
      document.getElementById('calls-container').innerHTML =
        `<div class="error-box">⚠️ <strong>No se pudieron cargar los datos.</strong><br>
         Verificá que la planilla sea pública.<br><small style="opacity:.7">${e.message}</small></div>`;
      document.getElementById('puts-container').innerHTML = '';
    } finally {
      document.getElementById('refresh-btn').disabled = false;
    }
  }

  /* ── Countdown ─────────────────────────────────────── */
  function resetCountdown() {
    clearInterval(cdTimer); cdVal = REFRESH_S;
    document.getElementById('countdown').textContent = cdVal;
    cdTimer = setInterval(() => {
      document.getElementById('countdown').textContent = --cdVal;
      if (cdVal <= 0) { clearInterval(cdTimer); fetchData(); }
    }, 1000);
  }

  fetchData();
</script>
</body>
</html>
